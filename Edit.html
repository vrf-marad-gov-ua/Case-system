<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VIM | Case Update</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f1f5f9;
    font-family:Tahoma,Arial;
    color:#172033;
}

.container{
    width:min(1100px,94%);
    margin:30px auto;
}

.header{
    background:white;
    padding:20px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.logo{
    width:60px;
    height:60px;
    object-fit:contain;
}

.title{
    font-size:24px;
    font-weight:900;
}

.search{
    background:white;
    padding:20px;
    border-radius:20px;
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search input{
    flex:1;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    font-size:15px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 20px;
    cursor:pointer;
    font-weight:bold;
}

.search button{
    background:#123c69;
    color:white;
}

.results{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.07);
}

.card h3{
    margin-top:0;
}

.field{
    margin:12px 0;
}

.field label{
    display:block;
    font-size:12px;
    color:#64748b;
    margin-bottom:5px;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px;
}

.save{
    width:100%;
    background:#16a34a;
    color:white;
    margin-top:15px;
}

.message{
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:600px){

    .search{
        flex-direction:column;
    }

    .container{
        width:94%;
        margin:15px auto;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img
src="logo.png"
class="logo"
>

<div class="title">
VIM Case Update
</div>

</div>


<div class="search">

<input
id="query"
placeholder="شماره پاسپورت یا شماره پرونده"
>

<button onclick="searchCases()">
جستجو
</button>

</div>


<div
id="message"
class="message"
></div>


<div
id="results"
class="results"
></div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxBuJiCxMmHZgWsP0QuCAyJDoYV_jkucX5aAAb6FjHgdTUSzi79kBSHBMAirVGtpyustA/exec";


let foundCases = [];


/* ============================================
   SEARCH
============================================ */

async function searchCases(){

    const query =
        document
        .getElementById("query")
        .value
        .trim();

    if(!query){
        showMessage(
            "لطفاً شماره پاسپورت یا شماره پرونده را وارد کنید.",
            "error"
        );
        return;
    }

    try{

        const response =
            await fetch(
                API_URL +
                "?action=search&query=" +
                encodeURIComponent(query)
            );

        const data =
            await response.json();

        if(!data.success){

            showMessage(
                data.message ||
                "جستجو ناموفق بود.",
                "error"
            );

            return;
        }

        foundCases =
            data.cases || [];

        renderResults();

    }catch(error){

        showMessage(
            "ارتباط با Google Sheet برقرار نشد.",
            "error"
        );

    }
}


/* ============================================
   RENDER
============================================ */

function renderResults(){

    const box =
        document.getElementById("results");

    box.innerHTML = "";

    if(!foundCases.length){

        box.innerHTML =
        `
        <div class="card">
            هیچ پرونده‌ای پیدا نشد.
        </div>
        `;

        return;
    }


    foundCases.forEach(function(c,index){

        let fields = "";

        Object.keys(c).forEach(function(key){

            if(
                key.startsWith("_") ||
                !c[key]
            ){
                return;
            }

            if(
                key === "Passport Number" ||
                key === "Case Number"
            ){
                return;
            }

            fields += `

            <div class="field">

                <label>
                    ${escapeHTML(key)}
                </label>

                <input
                data-case="${index}"
                data-field="${escapeAttribute(key)}"
                value="${escapeAttribute(c[key])}"
                >

            </div>

            `;

        });


        box.innerHTML += `

        <div class="card">

            <h3>
                ${escapeHTML(c["Case Number"] || "")}
            </h3>

            <div class="field">

                <label>
                    Passport Number
                </label>

                <input
                value="${escapeAttribute(c["Passport Number"] || "")}"
                readonly
                >

            </div>

            ${fields}

            <button
            class="save"
            onclick="saveCase(${index})"
            >
            ذخیره تمام تغییرات
            </button>

        </div>

        `;

    });

}


/* ============================================
   SAVE
============================================ */

async function saveCase(index){

    const caseData =
        foundCases[index];

    const inputs =
        document.querySelectorAll(
            `[data-case="${index}"]`
        );

    const updates = {};

    inputs.forEach(function(input){

        updates[
            input.dataset.field
        ] = input.value;

    });


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:JSON.stringify({

                        action:"updateCase",

                        passport:
                        caseData["Passport Number"],

                        caseNumber:
                        caseData["Case Number"],

                        updates:updates

                    })

                }
            );

        const data =
            await response.json();

        if(data.success){

            showMessage(
                "تغییرات با موفقیت در Google Sheet ثبت شد.",
                "success"
            );

        }else{

            showMessage(
                data.message ||
                "ذخیره انجام نشد.",
                "error"
            );

        }

    }catch(error){

        showMessage(
            "خطا هنگام ذخیره اطلاعات.",
            "error"
        );

    }

}


/* ============================================
   MESSAGE
============================================ */

function showMessage(text,type){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display =
        "block";
}


/* ============================================
   ESCAPE
============================================ */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeAttribute(value){

    return escapeHTML(value);
}

</script>

</body>
</html>
